{% extends "base.html" %}
{% block titulo %}ConsuAI · Configurações{% endblock %}
{% block conteudo %}
<div class="card card-estreito">
    <h1>Configurações</h1>
    <form method="POST">
        <label>Salário padrão mensal</label>
        <input type="text" name="salario_padrao" value="{{ user.salario_padrao }}" placeholder="Ex: 3500.00">
        <p class="texto-ajuda">Usado no botão "Lançar salário do mês" no painel principal.</p>
        <button type="submit" class="btn btn-primario">Salvar</button>
    </form>
</div>
{% endblock %}
