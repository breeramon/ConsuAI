{% extends "base.html" %}
{% block titulo %}ConsuAI · Entrar{% endblock %}
{% block conteudo %}
<div class="card card-estreito">
    <h1>Entrar</h1>
    <form method="POST">
        <label>Usuário</label>
        <input type="text" name="username" required autofocus>

        <label>Senha</label>
        <input type="password" name="senha" required>

        <button type="submit" class="btn btn-primario">Entrar</button>
    </form>
    <p class="texto-secundario">Não tem conta? <a href="{{ url_for('registro') }}">Criar conta</a></p>
</div>
{% endblock %}
